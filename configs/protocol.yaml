# SIH 26174 baseline — synthetic box-handling experiment.
# The official problem statement shown to the team identifies a red inner box and
# a second coloured inner box, but the second colour and full sequence are not
# visible. Rename second_colored_box when SIH publishes that information.
debounce_frames: 3
pending_window_s: 1.0
lookback_window_s: 2.0
anomaly_messages:
  outer_container:completed_before_return: "Warning: Both inner boxes must be returned before completing the experiment."
steps:
  - id: retrieve_red_box
    name: Retrieve red box from outer container
    expects: [red_box:removed_from_outer_container]
    timeout_s: 30
    safety_critical: true
  - id: retrieve_second_colored_box
    name: Retrieve second coloured box from outer container
    expects: [second_colored_box:removed_from_outer_container]
    timeout_s: 30
    safety_critical: true
  - id: return_red_box
    name: Return red box to outer container
    expects: [red_box:returned_to_outer_container]
    timeout_s: 30
    safety_critical: true
  - id: return_second_colored_box
    name: Return second coloured box to outer container
    expects: [second_colored_box:returned_to_outer_container]
    timeout_s: 30
    safety_critical: true
