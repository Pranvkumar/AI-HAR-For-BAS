# Synthetic local representation of the visible SIH box-experiment information.
# The second colour is intentionally left configurable until SIH publishes it.
debounce_frames: 3
pending_window_s: 1.0
lookback_window_s: 2.0
steps:
  - id: retrieve_red_box
    name: Retrieve red box
    expects: [red_box:removed_from_outer_container]
    timeout_s: 20
    safety_critical: true
  - id: retrieve_second_colored_box
    name: Retrieve second coloured box
    expects: [second_colored_box:removed_from_outer_container]
    timeout_s: 20
    safety_critical: true
  - id: return_red_box
    name: Return red box
    expects: [red_box:returned_to_outer_container]
    timeout_s: 20
    safety_critical: true
  - id: return_second_colored_box
    name: Return second coloured box
    expects: [second_colored_box:returned_to_outer_container]
    timeout_s: 20
    safety_critical: true
